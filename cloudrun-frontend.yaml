apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shield-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/gen-lang-client-0285486889/shield-ai/shield-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          # NEXT_PUBLIC_BACKEND_URL is baked into the image at build time.
          # No runtime env vars needed for the frontend itself.
          # To change the backend URL, rebuild the image with a new --build-arg.
