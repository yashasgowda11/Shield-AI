apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: shield-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: us-central1-docker.pkg.dev/gen-lang-client-0285486889/shield-ai/shield-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          env:
            # BACKEND_URL is used server-side by the /api/backend proxy route.
            # The browser never calls the backend directly — no CORS needed.
            - name: BACKEND_URL
              value: "https://shield-backend-aiffxvrl4q-uc.a.run.app"
