# Shield AI — Cloud Build CI/CD pipeline
#
# Triggered automatically on push to the `testing` or `main` branch.
# Set up the trigger in GCP Console → Cloud Build → Triggers, or run:
#
#   gcloud builds triggers create github \
#     --repo-name=Shield-AI \
#     --repo-owner=yashasgowda11 \
#     --branch-pattern="^(main|testing)$" \
#     --build-config=cloudbuild.yaml
#
# Substitution variables (set in the trigger UI or --substitutions flag):
#   _REGION       — GCP region          (default: us-central1)
#   _AR_REPO      — Artifact Registry   (default: shield-ai)
#   _BACKEND_SVC  — Cloud Run service   (default: shield-backend)
#   _FRONTEND_SVC — Cloud Run service   (default: shield-frontend)

substitutions:
  _REGION: us-central1
  _AR_REPO: shield-ai
  _BACKEND_SVC: shield-backend
  _FRONTEND_SVC: shield-frontend

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:

  # ── Backend ────────────────────────────────────────────────────────────

  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-backend:$SHORT_SHA
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-backend:latest
      - --cache-from=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-backend:latest
      - .

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-backend
    waitFor: [build-backend]

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_BACKEND_SVC
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-backend:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --concurrency=10
      - --timeout=300
      - --service-account=shield-ai-backend@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=SKIP_RAG_INIT=false
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,PINECONE_INDEX_NAME=PINECONE_INDEX_NAME:latest,GCS_BUCKET_NAME=GCS_BUCKET_NAME:latest
      - --add-cloudsql-instances=gen-lang-client-0285486889:us-central1:free-trial-first-project
    waitFor: [push-backend]

  # ── Frontend ───────────────────────────────────────────────────────────

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=frontend.Dockerfile
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-frontend:$SHORT_SHA
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-frontend:latest
      - --cache-from=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-frontend:latest
      - .
    waitFor: ['-']   # run in parallel with backend build

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-frontend
    waitFor: [build-frontend]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
          BACKEND_URL=$(gcloud run services describe $_BACKEND_SVC \
            --region=$_REGION --format='value(status.url)')
          echo "Backend URL: $$BACKEND_URL"
          gcloud run deploy $_FRONTEND_SVC \
            --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-frontend:$SHORT_SHA \
            --region=$_REGION \
            --platform=managed \
            --allow-unauthenticated \
            --port=8501 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=20 \
            --timeout=120 \
            --set-env-vars="BACKEND_URL=$$BACKEND_URL"
    waitFor: [push-frontend, deploy-backend]

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-backend:$SHORT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/shield-frontend:$SHORT_SHA
